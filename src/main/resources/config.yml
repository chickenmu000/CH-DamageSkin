# 스킨을 장착하지 않은 유저에게 보여줄 기본 폰트 (리소스팩 assets/minecraft/font/<이름>.json)
# 비워두면("") 스킨을 장착한 유저에게만 데미지가 표시됩니다.
default-skin: damage_default

# true = ProtocolLib 패킷으로 표시 (서버에 엔티티가 생기지 않음, ProtocolLib 필요)
# false 이거나 ProtocolLib 이 없거나 패킷 전송에 실패하면 TextDisplay 엔티티 방식으로 표시합니다.
packet-mode: true

# true = 때린 본인에게만 보임 / false = 주변 유저에게도 보임 (other-opacity 투명도로)
only-attacker: true

# 때린 본인이 아닌 다른 유저가 볼 때의 투명도 (1.0 ~ 0.0) / 보이는 거리(블록)
other-opacity: 0.5
view-distance: 24.0

# true = 몹에게 실제로 들어간 피해량(체력 감소량)을 표시 / false = 계산된 최종 피해량
actual-damage-mode: false

# 숫자가 뜨는 높이 보정(블록)
offset: 0.0

# 숫자 위치를 좌우로 흩뿌리는 범위(블록)
random-offset: 0.4

# 숫자 기본 크기 배율 (animation 의 배율에 곱해집니다)
scale: 1.5

# 애니메이션: 커졌다가(pop) -> 줄어들고(settle) -> 잠시 머문 뒤 위로 올라가며(rise) 어두워집니다.
animation:
  start-scale: 0.5
  pop-scale: 1.35
  settle-scale: 0.85
  end-scale: 0.75
  stay-ticks: 5
  rise: 1.5
  rise-ticks: 10
  fade-out-ticks: 5
  # 단계별 글자색 (시작, 올라갈 때, 사라지기 전). 이미지 숫자는 이 색이 곱해져서 어두워집니다. 색 변화를 원치 않으면 모두 #ffffff
  colors: ['#ededed', '#cfcfcf', '#bfbfbf']

# ModelEngine 모델 몹은 모델의 가장 높은 곳을 기준으로 숫자를 띄웁니다. (ModelEngine 이 있을 때만)
modelengine:
  enabled: true
  height-scale: 1.0

